<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
<title>WoW Addon Webhooks for Discord</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><img src="../../assets/icon.png" alt=""><h1 data-t="appName"></h1></header>

<section id="update" class="banner" hidden>
  <span class="grow" id="updateText"></span><button id="updateButton" class="primary"></button>
</section>

<!-- The first time: three steps, one at a time. -->
<main id="wizard" hidden>
  <ol class="progress" id="progress">
    <li data-t="s1Short"></li><li data-t="s2Short"></li><li data-t="s3Short"></li>
  </ol>

  <section class="card step" data-step="1">
    <h2 data-t="s1Title"></h2>
    <p data-t="s1Text"></p>
    <div id="s1Plugins"></div>
    <p id="s1None" class="problem" data-t="s1None" hidden></p>
    <details class="more" id="s1More">
      <summary data-t="s1Where"></summary>
      <div id="s1Games"></div>
    </details>
    <div class="nav"><button id="s1Look" data-t="lookAgain"></button><span class="grow"></span><button id="s1Next" class="primary" data-t="next"></button></div>
  </section>

  <section class="card step" data-step="2">
    <h2 data-t="s2Title"></h2>
    <p data-t="s2Text"></p>
    <div id="s2Connected" class="connected" hidden>
      <p id="s2ConnectedText" class="ok"></p>
      <button id="s2Other" data-t="useOther"></button>
    </div>
    <div id="s2Form"></div>
    <div class="nav"><button id="s2Back" data-t="back"></button><span class="grow"></span><button id="s2Next" class="primary" data-t="next"></button></div>
  </section>

  <section class="card step" data-step="3">
    <h2 data-t="s3Title"></h2>
    <p data-t="s3Text"></p>
    <div id="s3Editor"></div>
    <p id="s3Msg" hidden></p>
    <div class="nav"><button id="s3Back" data-t="back"></button><span class="grow"></span><button id="finish" class="primary" data-t="finish"></button></div>
  </section>
</main>

<!-- After setup: four tabs. -->
<main id="home" hidden>
  <nav class="tabs" id="tabs">
    <button data-tab="home" data-t="tabHome"></button>
    <button data-tab="flows" data-t="tabFlows"></button>
    <button data-tab="addons" data-t="tabAddons"></button>
    <button data-tab="settings" data-t="tabSettings"></button>
  </nav>

  <section class="tab" data-tab="home">
    <h2 class="page-title" data-t="tabHome"></h2>
    <p class="intro" data-t="homeIntro"></p>
    <div id="newPlugins"></div>
    <div class="card status" id="statusCard">
      <p id="statusMain" class="big"></p>
      <div id="statusLines" class="hint"></div>
      <div class="row"><button id="pause"></button></div>
    </div>
    <div id="homePlugins"></div>
  </section>

  <section class="tab" data-tab="flows">
    <h2 class="page-title" data-t="tabFlows"></h2>
    <p class="intro" data-t="flowsIntro"></p>
    <div id="flowEditor"></div>
  </section>

  <section class="tab" data-tab="addons">
    <h2 class="page-title" data-t="tabAddons"></h2>
    <p class="intro" data-t="addonsIntro"></p>
    <ul id="addons" class="list"></ul>
    <div class="row"><button id="addonsLook" data-t="lookAgain"></button><button id="addonsInstall" data-t="installCode"></button></div>
    <p id="addonsMsg" hidden></p>
    <div id="addonsWarn" class="card warn" role="alertdialog" hidden></div>
  </section>

  <section class="tab" data-tab="settings">
    <h2 class="page-title" data-t="tabSettings"></h2>
    <p class="intro" data-t="settingsIntro"></p>
    <div class="card">
      <h2 data-t="s1Where"></h2>
      <div id="setGames"></div>
    </div>
    <div class="card">
      <h2 data-t="appTitle"></h2>
      <div id="options" class="ticks"></div>
      <div class="row"><button id="postNow" data-t="postNow"></button></div>
      <p class="hint" data-t="postNowHelp"></p>
    </div>
    <div class="card">
      <h2 data-t="logTitle"></h2>
      <ul id="log" class="log"></ul>
    </div>
    <p class="hint" data-t="notAffiliated"></p>
  </section>
</main>
<script src="flow-editor.js"></script>
<script src="renderer.js"></script>
</body>
</html>
